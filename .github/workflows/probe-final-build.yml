name: Probe Final Agent Build

on:
  push:
    paths:
      - '.github/workflows/probe-final-build.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve final build run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 32291e30e653a79f25be04107359efe3b2b77482
        run: |
          set -euo pipefail
          result=''
          for i in $(seq 1 60); do
            json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-agent.yml/runs?head_sha=${TARGET_SHA}&per_page=10")
            run_id=$(printf '%s' "$json" | python -c 'import sys,json; d=json.load(sys.stdin); r=d.get("workflow_runs",[]); print(r[0]["id"] if r else "")')
            status=$(printf '%s' "$json" | python -c 'import sys,json; d=json.load(sys.stdin); r=d.get("workflow_runs",[]); print(r[0]["status"] if r else "missing")')
            conclusion=$(printf '%s' "$json" | python -c 'import sys,json; d=json.load(sys.stdin); r=d.get("workflow_runs",[]); print(r[0].get("conclusion") or "") if r else print("")')
            if [ "$status" = completed ]; then
              result="run_id=$run_id\nhead_sha=$TARGET_SHA\nstatus=$status\nconclusion=$conclusion"
              break
            fi
            sleep 10
          done
          if [ -z "$result" ]; then result="run_id=${run_id:-}\nhead_sha=$TARGET_SHA\nstatus=${status:-not_found}\nconclusion=${conclusion:-}"; fi
          printf '%b\n' "$result" > diagnostics/FINAL_AGENT_BUILD_PROBE.txt
      - name: Commit probe result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/FINAL_AGENT_BUILD_PROBE.txt
          git commit -m 'Record probed final Agent build result'
          git pull --rebase origin main
          git push
