name: One-Time Publish Sokna Print Agent 6.0.0

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/publish-v6.0.0.yml']

permissions:
  contents: write

env:
  TARGET_SHA: '220a1d690a56cdb68f360910f8fef5f5e9c42c21'
  VERSION: '6.0.0'

concurrency:
  group: one-time-publish-v6.0.0
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout clean release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify source identity and cleanliness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:TARGET_SHA){throw "Release source mismatch: $actual"}
          if(Test-Path 'agent6.zip'){throw 'Legacy agent6.zip is forbidden.'}
          if(Test-Path 'ci/patch_agent_source.py'){throw 'Build-time patching is forbidden.'}
          $wf=@(Get-ChildItem '.github/workflows' -File | Select-Object -ExpandProperty Name | Sort-Object)
          if(($wf -join ',') -ne 'build-agent.yml,windows-reliability.yml'){throw "Unexpected workflows in tagged source: $($wf -join ', ')"}
          New-Item -ItemType Directory -Force release-evidence | Out-Null
          @("repo=$env:GITHUB_REPOSITORY","branch=main","commit=$actual","version=$env:VERSION","source_of_truth=agent/","workflows=$($wf -join ',')") | Set-Content release-evidence/SOURCE_AUDIT.txt -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent/global.json

      - name: Build audit tests and package
        shell: pwsh
        working-directory: agent
        run: ./scripts/Build-Agent.ps1

      - name: Package tracked source archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out="agent/artifacts/Sokna-Print-Agent-$env:VERSION-source.zip"
          Remove-Item $out -Force -ErrorAction SilentlyContinue
          & git archive --format=zip --output=$out "$env:TARGET_SHA`:agent"
          if($LASTEXITCODE -ne 0 -or !(Test-Path $out -PathType Leaf)){throw 'Tracked source archive failed.'}

      - name: Standard Windows install gate
        shell: pwsh
        working-directory: agent
        run: ./scripts/Test-Windows-Install.ps1 -Artifacts "$PWD/artifacts"

      - name: Extended Windows recovery Spooler uninstall reinstall gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=(Resolve-Path "agent/artifacts/Sokna-Print-Agent-$env:VERSION-Setup.exe").Path
          $service='SoknaPrintAgent6'
          $installRoot=Join-Path $env:ProgramFiles 'Sokna\PrintAgent'
          $dataRoot=Join-Path $env:ProgramData 'Sokna\PrintAgent'
          $health=Join-Path $dataRoot 'health.json'
          $report='release-evidence/EXTENDED_WINDOWS_GATE.txt'
          "timestamp_start=$((Get-Date).ToUniversalTime().ToString('o'))" | Set-Content $report
          function Install-Agent {
            $p=Start-Process -FilePath $setup -ArgumentList '/quiet' -Wait -PassThru
            if($p.ExitCode -ne 0){throw "Setup failed: $($p.ExitCode)"}
            if((Get-Service $service -ErrorAction Stop).Status -ne 'Running'){throw 'Agent service is not Running.'}
            if(!(Test-Path $health -PathType Leaf)){throw 'health.json missing.'}
          }
          Install-Agent
          'first_install=PASS' | Out-File $report -Append
          $before=(Get-CimInstance Win32_Service -Filter "Name='$service'").ProcessId
          Restart-Service $service -Force; Start-Sleep -Seconds 3
          $after=(Get-CimInstance Win32_Service -Filter "Name='$service'").ProcessId
          if((Get-Service $service).Status -ne 'Running' -or $after -le 0){throw 'Service restart failed.'}
          "service_restart=PASS before_pid=$before after_pid=$after" | Out-File $report -Append
          $killPid=$after; Stop-Process -Id $killPid -Force
          $recovered=$false
          for($i=0;$i -lt 30;$i++){Start-Sleep -Seconds 2;$w=Get-CimInstance Win32_Service -Filter "Name='$service'" -ErrorAction SilentlyContinue;if($w -and $w.State -eq 'Running' -and $w.ProcessId -gt 0 -and $w.ProcessId -ne $killPid){$recovered=$true;$newPid=$w.ProcessId;break}}
          if(!$recovered){throw 'Service Recovery failed after process kill.'}
          "service_kill_recovery=PASS old_pid=$killPid new_pid=$newPid" | Out-File $report -Append
          if((Get-Service Spooler).Status -ne 'Running'){Start-Service Spooler}
          Stop-Service Spooler -Force; Start-Sleep -Seconds 2
          if((Get-Service Spooler).Status -ne 'Stopped'){throw 'Spooler stop failed.'}
          Start-Service Spooler; Start-Sleep -Seconds 2
          if((Get-Service Spooler).Status -ne 'Running'){throw 'Spooler restart failed.'}
          if((Get-Service $service).Status -ne 'Running'){throw 'Agent did not survive Spooler restart.'}
          'spooler_stop_start=PASS agent_running=True' | Out-File $report -Append
          $sentinel=Join-Path $dataRoot 'release-preserve-sentinel.txt'; Set-Content $sentinel 'preserve' -Encoding ascii
          $uninstall=Join-Path $installRoot 'Uninstall-SoknaPrintAgent.ps1'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $uninstall
          if($LASTEXITCODE -ne 0){throw "Uninstall failed: $LASTEXITCODE"}
          if(Get-Service $service -ErrorAction SilentlyContinue){throw 'Service remains after uninstall.'}
          if(Test-Path $installRoot){throw 'Program Files remains after uninstall.'}
          if(!(Test-Path $sentinel)){throw 'ProgramData preservation failed.'}
          'uninstall_preservation=PASS' | Out-File $report -Append
          Install-Agent
          'reinstall_after_uninstall=PASS' | Out-File $report -Append
          $uninstall=Join-Path $installRoot 'Uninstall-SoknaPrintAgent.ps1'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $uninstall
          if($LASTEXITCODE -ne 0){throw "Cleanup uninstall failed: $LASTEXITCODE"}
          Remove-Item $dataRoot -Recurse -Force -ErrorAction SilentlyContinue
          'extended_windows_gate=PASS' | Out-File $report -Append

      - name: Verify artifacts and source binding
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $art='agent/artifacts'
          foreach($n in @("Sokna-Print-Agent-$env:VERSION-Setup.exe","Sokna-Print-Agent-$env:VERSION-win-x64.zip","Sokna-Print-Agent-$env:VERSION-source.zip","SHA256SUMS-Agent-$env:VERSION.txt","BUILD_ARTIFACTS-Agent-$env:VERSION.json")){if(!(Test-Path (Join-Path $art $n))){throw "Missing artifact: $n"}}
          $meta=Get-Content (Join-Path $art "BUILD_ARTIFACTS-Agent-$env:VERSION.json") -Raw
          if($meta -notmatch [Regex]::Escape($env:TARGET_SHA)){throw 'Build metadata source commit mismatch.'}
          "name`tsize_bytes`tsha256" | Set-Content release-evidence/ARTIFACTS.tsv
          foreach($n in @("Sokna-Print-Agent-$env:VERSION-Setup.exe","Sokna-Print-Agent-$env:VERSION-win-x64.zip","Sokna-Print-Agent-$env:VERSION-source.zip")){$p=Join-Path $art $n;$f=Get-Item $p;$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();"$n`t$($f.Length)`t$h" | Out-File release-evidence/ARTIFACTS.tsv -Append}

      - name: Prepare release notes
        shell: pwsh
        run: |
          @'
          # Sokna Print Agent 6.0.0

          Official Sokna Print Agent 6 release for Sokna Café Print API v4.

          Includes the Windows Service architecture, SQLite durable local queue, isolated Worker, Winspool integration, durable submission-fence ambiguity protection, Control UI, Setup installer/uninstaller and self-contained Windows x64 package.

          Validated before release: restore/build/unit tests, NuGet vulnerability audit, package integrity/collision guard, Setup.exe /quiet, Service start/health, Automatic Delayed Start and Recovery configuration, Service restart, process-kill recovery, Print Spooler stop/start, uninstall with ProgramData preservation, reinstall after uninstall, and source-bound SHA-256 artifacts.

          Contract: `submitted` means accepted by Windows Spooler, not physical paper confirmation. `unknown` and `recovery_hold` require human resolution and are never automatically reprinted.

          UAT_REQUIRED because Sokna Café is still in test/staging: real machine-wide printer visibility under the Service account, Persian/RTL output on paper, Kitchen/Bar/Customer receipts, paper-out recovery, physical printer disconnect/reconnect, Windows reboot on the target PC, 50 consecutive physical prints, operational internet disconnect/reconnect, and 24h/72h soak.

          Supported target: Windows x64; self-contained .NET runtime.
          '@ | Set-Content release-notes.md -Encoding utf8

      - name: Publish or verify v6.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY *> $null
          $exists=($LASTEXITCODE -eq 0); $global:LASTEXITCODE=0
          if(!$exists){
            $art='agent/artifacts'
            $assets=@((Join-Path $art "Sokna-Print-Agent-$env:VERSION-Setup.exe"),(Join-Path $art "SHA256SUMS-Agent-$env:VERSION.txt"),(Join-Path $art "Sokna-Print-Agent-$env:VERSION-win-x64.zip"),(Join-Path $art "Sokna-Print-Agent-$env:VERSION-source.zip"))
            gh release create "v$env:VERSION" @assets --repo $env:GITHUB_REPOSITORY --target $env:TARGET_SHA --title "Sokna Print Agent $env:VERSION" --notes-file release-notes.md
            if($LASTEXITCODE -ne 0){throw 'Release creation failed.'}
          }
          git fetch origin "refs/tags/v$env:VERSION:refs/tags/v$env:VERSION" --force
          if($LASTEXITCODE -ne 0){throw 'Release tag fetch failed.'}
          $tagSha=(git rev-list -n 1 "v$env:VERSION").Trim()
          if($tagSha -ne $env:TARGET_SHA){throw "Tag target mismatch: $tagSha"}
          $j=gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --json assets,url,tagName,title
          $r=$j|ConvertFrom-Json;$names=@($r.assets|ForEach-Object{$_.name})
          foreach($n in @("Sokna-Print-Agent-$env:VERSION-Setup.exe","SHA256SUMS-Agent-$env:VERSION.txt","Sokna-Print-Agent-$env:VERSION-win-x64.zip")){if($names -notcontains $n){throw "Release asset missing: $n"}}
          "tag=v$env:VERSION`ntag_sha=$tagSha`nrelease_url=$($r.url)`nassets=$($names -join ',')" | Set-Content release-evidence/RELEASE.txt

      - name: Verify pinned URLs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $page="https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:VERSION";$asset="https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/Sokna-Print-Agent-$env:VERSION-Setup.exe"
          function AssertUrl($u,$name){$ok=$false;for($i=0;$i -lt 8;$i++){try{$r=Invoke-WebRequest -Uri $u -MaximumRedirection 8 -UseBasicParsing -Method Head -ErrorAction Stop;if($r.StatusCode -ge 200 -and $r.StatusCode -lt 400){$ok=$true;break}}catch{Start-Sleep -Seconds 5}};if(!$ok){throw "$name URL not reachable: $u"};"$name=PASS $u"|Out-File release-evidence/URL_CHECKS.txt -Append}
          AssertUrl $page 'release_page';AssertUrl $asset 'installer_asset'

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sokna-Print-Agent-6.0.0-Release-Evidence
          path: |
            release-evidence/**
            release-notes.md
            agent/artifacts/BUILD_ARTIFACTS-Agent-6.0.0.json
            agent/artifacts/SHA256SUMS-Agent-6.0.0.txt
            agent/artifacts/windows-smoke-evidence/**
          if-no-files-found: warn

      - name: Record final result on main
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $status='${{ job.status }}'
          gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --json url,assets,tagName,title *> release-view.json
          $visible=($LASTEXITCODE -eq 0);$global:LASTEXITCODE=0
          git fetch origin main;git switch main
          @("run_id=${{ github.run_id }}","job_status=$status","target_sha=$env:TARGET_SHA","release_visible=$visible","recorded_at=$((Get-Date).ToUniversalTime().ToString('o'))") | Set-Content RELEASE_V6_STATUS.txt -Encoding utf8
          if(Test-Path release-view.json){Get-Content release-view.json | Out-File RELEASE_V6_STATUS.txt -Append}
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add RELEASE_V6_STATUS.txt
          if(!(git diff --cached --quiet)){git commit -m 'Record v6.0.0 release result';git pull --rebase origin main;git push origin HEAD:main}
