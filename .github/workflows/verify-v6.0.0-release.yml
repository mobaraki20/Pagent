name: Verify Published Sokna Print Agent 6.0.0

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/verify-v6.0.0-release.yml']

permissions:
  contents: write

env:
  TARGET_SHA: '220a1d690a56cdb68f360910f8fef5f5e9c42c21'
  VERSION: '6.0.0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Verify release, tag, assets and public URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          release_json=$(gh api "repos/$repo/releases/tags/v$VERSION")
          tag_name=$(printf '%s' "$release_json" | python -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          html_url=$(printf '%s' "$release_json" | python -c 'import sys,json; print(json.load(sys.stdin)["html_url"])')
          asset_names=$(printf '%s' "$release_json" | python -c 'import sys,json; print("\n".join(a["name"] for a in json.load(sys.stdin)["assets"]))')
          test "$tag_name" = "v$VERSION"
          for required in "Sokna-Print-Agent-$VERSION-Setup.exe" "SHA256SUMS-Agent-$VERSION.txt" "Sokna-Print-Agent-$VERSION-win-x64.zip"; do
            printf '%s\n' "$asset_names" | grep -Fx "$required" >/dev/null || { echo "missing asset $required"; exit 1; }
          done
          ref_json=$(gh api "repos/$repo/git/ref/tags/v$VERSION")
          ref_type=$(printf '%s' "$ref_json" | python -c 'import sys,json; print(json.load(sys.stdin)["object"]["type"])')
          ref_sha=$(printf '%s' "$ref_json" | python -c 'import sys,json; print(json.load(sys.stdin)["object"]["sha"])')
          if [ "$ref_type" = tag ]; then
            tag_json=$(gh api "repos/$repo/git/tags/$ref_sha")
            ref_sha=$(printf '%s' "$tag_json" | python -c 'import sys,json; print(json.load(sys.stdin)["object"]["sha"])')
          fi
          test "$ref_sha" = "$TARGET_SHA" || { echo "tag target mismatch: $ref_sha"; exit 1; }
          page="https://github.com/$repo/releases/tag/v$VERSION"
          asset="https://github.com/$repo/releases/download/v$VERSION/Sokna-Print-Agent-$VERSION-Setup.exe"
          curl -fsSIL --retry 5 --retry-delay 2 "$page" >/dev/null
          curl -fsSIL -L --retry 5 --retry-delay 2 "$asset" >/dev/null
          {
            echo "status=PASS"
            echo "release=$html_url"
            echo "tag=v$VERSION"
            echo "tag_target=$ref_sha"
            echo "release_page_url=PASS $page"
            echo "installer_url=PASS $asset"
            echo "assets:"
            printf '%s\n' "$asset_names"
          } > RELEASE_V6_PUBLIC_VERIFICATION.txt
      - name: Commit verification evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_V6_PUBLIC_VERIFICATION.txt
          git commit -m 'Record v6.0.0 public release verification'
          git pull --rebase origin main
          git push origin HEAD:main
