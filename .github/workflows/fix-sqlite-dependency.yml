name: Fix Agent Source Compatibility

on:
  push:
    paths:
      - '.github/workflows/fix-sqlite-dependency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Patch agent6.zip
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (!(Test-Path 'agent6.zip')) { throw 'agent6.zip missing' }
          Remove-Item agent-src -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive agent6.zip agent-src -Force

          # Security: keep the non-vulnerable native SQLite bundle explicitly pinned.
          $props='agent-src/Directory.Packages.props'
          [xml]$xml=Get-Content $props
          $group=$xml.Project.ItemGroup | Select-Object -First 1
          $existing=$group.PackageVersion | Where-Object { $_.Include -eq 'SQLitePCLRaw.bundle_e_sqlite3' }
          if($existing){ $existing.Version='2.1.12' }
          else { $n=$xml.CreateElement('PackageVersion'); $n.SetAttribute('Include','SQLitePCLRaw.bundle_e_sqlite3'); $n.SetAttribute('Version','2.1.12'); [void]$group.AppendChild($n) }
          $xml.Save((Resolve-Path $props))

          $core='agent-src/src/Sokna.PrintAgent.Core/Sokna.PrintAgent.Core.csproj'
          [xml]$cx=Get-Content $core
          $ig=$cx.Project.ItemGroup | Select-Object -First 1
          if(-not ($ig.PackageReference | Where-Object { $_.Include -eq 'SQLitePCLRaw.bundle_e_sqlite3' })){
            $n=$cx.CreateElement('PackageReference'); $n.SetAttribute('Include','SQLitePCLRaw.bundle_e_sqlite3'); [void]$ig.AppendChild($n)
          }
          $cx.Save((Resolve-Path $core))

          # .NET 10 transaction typing.
          $store='agent-src/src/Sokna.PrintAgent.Core/LocalQueueStore.cs'
          $text=Get-Content $store -Raw
          $text=[regex]::Replace($text,'await using var (\w+)\s*=\s*await (\w+)\.BeginTransactionAsync\(ct\);','await using var $1=(SqliteTransaction)await $2.BeginTransactionAsync(ct);')
          Set-Content -Path $store -Value $text -Encoding utf8

          # Current SDK for WinForms.
          $control='agent-src/src/Sokna.PrintAgent.Control/Sokna.PrintAgent.Control.csproj'
          $controlText=Get-Content $control -Raw
          $controlText=$controlText.Replace('Project Sdk="Microsoft.NET.Sdk.WindowsDesktop"','Project Sdk="Microsoft.NET.Sdk"')
          Set-Content -Path $control -Value $controlText -Encoding utf8

          # Self-contained apps MUST keep isolated runtime dependency sets. Flat merging is unsafe because
          # Service (base runtime) and Worker/Control (WindowsDesktop) legitimately publish different DLL bytes.
          $build='agent-src/scripts/Build-Agent.ps1'
          $b=Get-Content $build -Raw
          $pattern='(?s)# All executables deliberately share one install directory\..*?foreach\(\$project in @\(''Sokna\.PrintAgent\.Service'',''Sokna\.PrintAgent\.Worker'',''Sokna\.PrintAgent\.Control''\)\)\{.*?\n\}'
          $replacement=@'
# Each self-contained process owns its runtime dependency set. Do not flatten these outputs:
# WindowsDesktop and base-runtime assemblies can share names while having different valid bytes.
$layout=[ordered]@{
  'Sokna.PrintAgent.Service'='Service'
  'Sokna.PrintAgent.Worker'='Worker'
  'Sokna.PrintAgent.Control'='Control'
}
foreach($project in $layout.Keys){
  $src=Join-Path $Output $project
  $dest=Join-Path $payload $layout[$project]
  New-Item $dest -ItemType Directory -Force|Out-Null
  Copy-Item (Join-Path $src '*') $dest -Recurse -Force
}
'@
          $new=[regex]::Replace($b,$pattern,$replacement)
          if($new -eq $b){ throw 'Build-Agent payload flatten block was not found for replacement.' }
          Set-Content $build $new -Encoding utf8

          # Service launches the isolated Worker directory, not a sibling executable in Service runtime.
          $service='agent-src/src/Sokna.PrintAgent.Service/PrintAgentService.cs'
          $s=Get-Content $service -Raw
          $s=$s.Replace('var worker=Path.Combine(AppContext.BaseDirectory,"Sokna.PrintAgent.Worker.exe");','var worker=Path.GetFullPath(Path.Combine(AppContext.BaseDirectory,"..","Worker","Sokna.PrintAgent.Worker.exe"));')
          $s=$s.Replace('WorkingDirectory=AppContext.BaseDirectory,RedirectStandardError=true','WorkingDirectory=Path.GetDirectoryName(worker)!,RedirectStandardError=true')
          Set-Content $service $s -Encoding utf8

          # Installer understands the isolated payload layout and remains rollback-compatible with a legacy root Service path.
          $install='agent-src/installer/Install-SoknaPrintAgent.ps1'
          $i=Get-Content $install -Raw
          if($i -notmatch 'function Resolve-ServiceExe'){
            $marker='$regPath=''HKLM:\SOFTWARE\Sokna\PrintAgent'''
            $helper=@'
$regPath='HKLM:\SOFTWARE\Sokna\PrintAgent'
function Resolve-ServiceExe([string]$Root){
  $isolated=Join-Path $Root 'Service\Sokna.PrintAgent.Service.exe'
  if(Test-Path $isolated -PathType Leaf){return $isolated}
  return (Join-Path $Root 'Sokna.PrintAgent.Service.exe')
}
'@
            $i=$i.Replace($marker,$helper.TrimEnd())
          }
          $i=$i.Replace("Join-Path `$source 'Sokna.PrintAgent.Service.exe'","Join-Path `$source 'Service\Sokna.PrintAgent.Service.exe'")
          $i=$i.Replace("Join-Path `$stage 'Sokna.PrintAgent.Service.exe'","Join-Path `$stage 'Service\Sokna.PrintAgent.Service.exe'")
          $i=$i.Replace("`$exe=Join-Path `$InstallRoot 'Sokna.PrintAgent.Service.exe'","`$exe=Resolve-ServiceExe `$InstallRoot")
          $oldBlock="if(`$hadPrevious -and (Test-Path (Join-Path `$InstallRoot 'Sokna.PrintAgent.Service.exe'))){`r`n    `$oldExe=Join-Path `$InstallRoot 'Sokna.PrintAgent.Service.exe'"
          if($i.Contains($oldBlock)){
            $i=$i.Replace($oldBlock,"if(`$hadPrevious){`r`n    `$oldExe=Resolve-ServiceExe `$InstallRoot`r`n    if(Test-Path `$oldExe){")
            $i=$i.Replace("    try{& sc.exe config `$service binPath= \"```"`$oldExe```"\" start= delayed-auto obj= LocalSystem | Out-Null;Start-Service `$service -ErrorAction SilentlyContinue}catch{}`r`n  }`r`n  throw `$failure","      try{& sc.exe config `$service binPath= \"```"`$oldExe```"\" start= delayed-auto obj= LocalSystem | Out-Null;Start-Service `$service -ErrorAction SilentlyContinue}catch{}`r`n    }`r`n  }`r`n  throw `$failure")
          }
          $i=$i.Replace("Open Sokna.PrintAgent.Control.exe as Administrator","Open Control\Sokna.PrintAgent.Control.exe as Administrator")
          Set-Content $install $i -Encoding utf8

          # Smoke test must assert the same installation contract.
          $smoke='agent-src/scripts/Test-Windows-Install.ps1'
          $t=Get-Content $smoke -Raw
          $t=$t.Replace("Join-Path `$installRoot 'Sokna.PrintAgent.Service.exe'","Join-Path `$installRoot 'Service\Sokna.PrintAgent.Service.exe'")
          $t=$t.Replace("Join-Path `$installRoot 'Sokna.PrintAgent.Worker.exe'","Join-Path `$installRoot 'Worker\Sokna.PrintAgent.Worker.exe'")
          $t=$t.Replace("Join-Path `$installRoot 'Sokna.PrintAgent.Control.exe'","Join-Path `$installRoot 'Control\Sokna.PrintAgent.Control.exe'")
          Set-Content $smoke $t -Encoding utf8

          Remove-Item agent6-new.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path 'agent-src/*' -DestinationPath 'agent6-new.zip' -CompressionLevel Optimal
          Move-Item agent6-new.zip agent6.zip -Force
          Get-FileHash agent6.zip -Algorithm SHA256

      - name: Commit patched agent archive
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent6.zip
          if (git diff --cached --quiet) { Write-Host 'No archive change'; exit 0 }
          git commit -m 'Isolate Agent process runtime payloads'
          git push

# connector trigger isolated payload refactor
