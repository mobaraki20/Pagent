name: Validate Installer Fix

on:
  push:
    paths:
      - '.github/workflows/validate-installer-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record validation run
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          "run_id=${{ github.run_id }}`ncommit=${{ github.sha }}`nstarted=$((Get-Date).ToUniversalTime().ToString('o'))" | Set-Content diagnostics/INSTALLER_FIX_RUN.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/INSTALLER_FIX_RUN.txt
          git commit -m 'Record installer fix validation run'
          git pull --rebase origin main
          git push

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent/global.json

      - name: Build current normal source
        id: build
        continue-on-error: true
        shell: pwsh
        working-directory: agent
        run: ./scripts/Build-Agent.ps1

      - name: Run real Windows installer smoke
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        working-directory: agent
        run: ./scripts/Test-Windows-Install.ps1 -Artifacts "$PWD/artifacts"

      - name: Capture result
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $report='diagnostics/INSTALLER_FIX_RESULT.txt'
          "run_id=${{ github.run_id }}`ncommit=${{ github.sha }}`nbuild=${{ steps.build.outcome }}`nsmoke=${{ steps.smoke.outcome }}`ntimestamp=$((Get-Date).ToUniversalTime().ToString('o'))" | Set-Content $report -Encoding utf8
          "`n=== SERVICE ===" | Out-File $report -Append
          & sc.exe query SoknaPrintAgent6 2>&1 | Out-File $report -Append
          & sc.exe qc SoknaPrintAgent6 2>&1 | Out-File $report -Append
          & sc.exe qfailure SoknaPrintAgent6 2>&1 | Out-File $report -Append
          "`n=== SETUP STDOUT/STDERR ===" | Out-File $report -Append
          foreach($n in @('sokna-setup-smoke.stdout.log','sokna-setup-smoke.stderr.log')){
            $p=Join-Path $env:RUNNER_TEMP $n
            if(Test-Path $p){"--- $n ---" | Out-File $report -Append;Get-Content $p | Where-Object {$_ -notmatch '(?i)authorization|bearer|token|secret|hmac'} | Out-File $report -Append}
          }
          $logs=Join-Path $env:ProgramData 'Sokna\PrintAgentSetup\logs'
          if(Test-Path $logs){"`n=== SETUP JSON ===" | Out-File $report -Append;Get-ChildItem $logs -File | Sort-Object LastWriteTime | Select-Object -Last 5 | ForEach-Object {Get-Content $_.FullName -Raw | Out-File $report -Append}}
          $pf=Join-Path $env:ProgramFiles 'Sokna\PrintAgent';"program_files=$(Test-Path $pf)" | Out-File $report -Append
          $pd=Join-Path $env:ProgramData 'Sokna\PrintAgent';"program_data=$(Test-Path $pd)" | Out-File $report -Append
          $health=Join-Path $pd 'health.json';"health=$(Test-Path $health -PathType Leaf)" | Out-File $report -Append
          if(Test-Path $health){Get-Content $health -Raw | Out-File $report -Append}

      - name: Commit validation result
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add diagnostics/INSTALLER_FIX_RESULT.txt
          if(!(git diff --cached --quiet)){git commit -m 'Capture installer fix validation result';git push}

      - name: Enforce validation
        if: always()
        shell: pwsh
        run: |
          if('${{ steps.build.outcome }}' -ne 'success'){throw 'Build failed.'}
          if('${{ steps.smoke.outcome }}' -ne 'success'){throw 'Windows installer smoke failed.'}
          Write-Host 'PASS Windows installer fix validation' -ForegroundColor Green
