name: Build Sokna Print Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'

permissions:
  contents: read

concurrency:
  group: sokna-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify single source of truth
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('agent/global.json','agent/Directory.Build.props','agent/scripts/Build-Agent.ps1','agent/scripts/Test-Windows-Install.ps1','agent/tests/Sokna.PrintAgent.PreviewAcceptance/Sokna.PrintAgent.PreviewAcceptance.csproj')){
            if(!(Test-Path $p -PathType Leaf)){throw "Required source missing: $p"}
          }
          if(Test-Path 'agent6.zip'){throw 'Legacy agent6.zip must not be part of the active source tree.'}
          if(Test-Path 'ci/patch_agent_source.py'){throw 'Build-time source patching is forbidden.'}
          [xml]$props=Get-Content 'agent/Directory.Build.props' -Raw
          $version=[string]$props.Project.PropertyGroup.SoknaAgentVersion
          if([string]::IsNullOrWhiteSpace($version)){throw 'SoknaAgentVersion missing.'}
          "AGENT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Agent version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent/global.json

      - name: Build, test and package
        shell: pwsh
        working-directory: agent
        run: ./scripts/Build-Agent.ps1

      - name: Diagnose .NET Desktop Runtime download trust
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://aka.ms/dotnet/10.0/windowsdesktop-runtime-win-x64.exe'
          $file=Join-Path $env:RUNNER_TEMP 'sokna-runtime-trust-probe.exe'
          Remove-Item $file -Force -ErrorAction SilentlyContinue
          try {
            $response=Invoke-WebRequest -Uri $uri -OutFile $file -PassThru -MaximumRedirection 10
            $finalUri=$response.BaseResponse.RequestMessage.RequestUri.AbsoluteUri
            $size=(Get-Item $file).Length
            $sig=Get-AuthenticodeSignature -LiteralPath $file
            Write-Host "runtime_probe_final_uri=$finalUri"
            Write-Host "runtime_probe_size=$size"
            Write-Host "runtime_probe_signature_status=$($sig.Status)"
            Write-Host "runtime_probe_signer_subject=$($sig.SignerCertificate.Subject)"
          }
          catch {
            Write-Host "runtime_probe_failure_type=$($_.Exception.GetType().FullName)"
            Write-Host "runtime_probe_failure_message=$($_.Exception.Message -replace '[\r\n]+',' ')"
          }
          finally {
            Remove-Item $file -Force -ErrorAction SilentlyContinue
          }

      - name: Windows install gate
        shell: pwsh
        working-directory: agent
        run: ./scripts/Test-Windows-Install.ps1 -Artifacts "$PWD/artifacts" -Version "$env:AGENT_VERSION"

      - name: Package tracked source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip="agent/artifacts/Sokna-Print-Agent-$env:AGENT_VERSION-source.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          & git archive --format=zip --output=$zip HEAD:agent
          if($LASTEXITCODE -ne 0 -or !(Test-Path $zip -PathType Leaf)){throw 'Tracked source archive failed.'}

      - name: Verify required artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=$env:AGENT_VERSION
          $required=@(
            "agent/artifacts/Sokna-Print-Agent-$v-Setup.exe",
            "agent/artifacts/Sokna-Print-Agent-$v-win-x64.zip",
            "agent/artifacts/Sokna-Print-Agent-$v-source.zip",
            "agent/artifacts/SHA256SUMS-Agent-$v.txt",
            "agent/artifacts/BUILD_ARTIFACTS-Agent-$v.json",
            "agent/artifacts/PACKAGE_SIZE_EVIDENCE-Agent-$v.json",
            'agent/artifacts/windows-smoke-evidence/INSTALL_GATE_EVIDENCE.txt'
          )
          foreach($p in $required){if(!(Test-Path $p -PathType Leaf)){throw "Required artifact missing: $p"}}
          $size=Get-Content "agent/artifacts/PACKAGE_SIZE_EVIDENCE-Agent-$v.json" -Raw | ConvertFrom-Json
          if([double]$size.hybrid_final.setup_reduction_percent_vs_baseline -le 0){throw 'Hybrid Setup did not reduce size versus baseline.'}
          if([double]$size.hybrid_final.zip_reduction_percent_vs_baseline -le 0){throw 'Hybrid payload ZIP did not reduce size versus baseline.'}
          if([double]$size.hybrid_final.setup_compression_gain_percent_vs_hybrid_uncompressed -le 0){throw 'Single-file compression did not improve Hybrid Setup size.'}
          $acceptance=Get-ChildItem 'agent/artifacts/acceptance-smoke' -Recurse -Filter '*.result.json' -ErrorAction Stop
          if($acceptance.Count -lt 37){throw "Acceptance smoke evidence incomplete: expected at least 37 result files, found $($acceptance.Count)."}
          foreach($id in @('A35','A37','A38','A47')){
            $result=Get-ChildItem "agent/artifacts/acceptance-smoke/$id" -Filter "$id.result.json" -ErrorAction Stop | Select-Object -First 1
            if($null -eq $result){throw "Required preview acceptance evidence missing: $id"}
            $json=Get-Content $result.FullName -Raw | ConvertFrom-Json
            if($json.status -ne 'PASS'){throw "Preview acceptance case did not PASS: $id => $($json.status)"}
          }
          if(!(Test-Path 'agent/artifacts/acceptance-smoke/A47/A47.samples.json' -PathType Leaf)){throw 'A47 raw latency samples are missing.'}

      - name: Upload artifacts and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sokna-Print-Agent-${{ env.AGENT_VERSION }}-Windows
          path: |
            agent/artifacts/Sokna-Print-Agent-${{ env.AGENT_VERSION }}-Setup.exe
            agent/artifacts/Sokna-Print-Agent-${{ env.AGENT_VERSION }}-win-x64.zip
            agent/artifacts/Sokna-Print-Agent-${{ env.AGENT_VERSION }}-source.zip
            agent/artifacts/SHA256SUMS-Agent-${{ env.AGENT_VERSION }}.txt
            agent/artifacts/BUILD_ARTIFACTS-Agent-${{ env.AGENT_VERSION }}.json
            agent/artifacts/PACKAGE_SIZE_EVIDENCE-Agent-${{ env.AGENT_VERSION }}.json
            agent/artifacts/windows-smoke-evidence/**
            agent/artifacts/acceptance-smoke/**
          if-no-files-found: error
