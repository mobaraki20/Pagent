name: Build Sokna Print Agent 6

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'

permissions:
  contents: read

concurrency:
  group: sokna-agent-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify single source of truth
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('agent/global.json','agent/scripts/Build-Agent.ps1','agent/scripts/Test-Windows-Install.ps1')){
            if(!(Test-Path $p -PathType Leaf)){throw "Required source missing: $p"}
          }
          if(Test-Path 'agent6.zip'){throw 'Legacy agent6.zip must not be part of the active source tree.'}
          if(Test-Path 'ci/patch_agent_source.py'){throw 'Build-time source patching is forbidden.'}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent/global.json

      - name: Build, test and package
        shell: pwsh
        working-directory: agent
        run: ./scripts/Build-Agent.ps1

      - name: Windows install gate
        shell: pwsh
        working-directory: agent
        run: ./scripts/Test-Windows-Install.ps1 -Artifacts "$PWD/artifacts"

      - name: Package tracked source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='agent/artifacts/Sokna-Print-Agent-6.0.0-source.zip'
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          & git archive --format=zip --output=$zip HEAD:agent
          if($LASTEXITCODE -ne 0 -or !(Test-Path $zip -PathType Leaf)){throw 'Tracked source archive failed.'}

      - name: Verify required artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $required=@(
            'agent/artifacts/Sokna-Print-Agent-6.0.0-Setup.exe',
            'agent/artifacts/Sokna-Print-Agent-6.0.0-win-x64.zip',
            'agent/artifacts/Sokna-Print-Agent-6.0.0-source.zip',
            'agent/artifacts/SHA256SUMS-Agent-6.0.0.txt',
            'agent/artifacts/BUILD_ARTIFACTS-Agent-6.0.0.json',
            'agent/artifacts/windows-smoke-evidence/INSTALL_GATE_EVIDENCE.txt'
          )
          foreach($p in $required){if(!(Test-Path $p -PathType Leaf)){throw "Required artifact missing: $p"}}

      - name: Upload artifacts and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sokna-Print-Agent-6.0.0-Windows
          path: |
            agent/artifacts/Sokna-Print-Agent-6.0.0-Setup.exe
            agent/artifacts/Sokna-Print-Agent-6.0.0-win-x64.zip
            agent/artifacts/Sokna-Print-Agent-6.0.0-source.zip
            agent/artifacts/SHA256SUMS-Agent-6.0.0.txt
            agent/artifacts/BUILD_ARTIFACTS-Agent-6.0.0.json
            agent/artifacts/windows-smoke-evidence/**
          if-no-files-found: error
