name: Build Sokna Print Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'

permissions:
  contents: read

concurrency:
  group: sokna-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify single source of truth
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('agent/global.json','agent/Directory.Build.props','agent/scripts/Build-Agent.ps1','agent/scripts/Test-Windows-Install.ps1')){
            if(!(Test-Path $p -PathType Leaf)){throw "Required source missing: $p"}
          }
          if(Test-Path 'agent6.zip'){throw 'Legacy agent6.zip must not be part of the active source tree.'}
          if(Test-Path 'ci/patch_agent_source.py'){throw 'Build-time source patching is forbidden.'}
          [xml]$props=Get-Content 'agent/Directory.Build.props' -Raw
          $version=[string]$props.Project.PropertyGroup.SoknaAgentVersion
          if([string]::IsNullOrWhiteSpace($version)){throw 'SoknaAgentVersion missing.'}
          "AGENT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Agent version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent/global.json

      - name: Build, test and package
        shell: pwsh
        working-directory: agent
        run: ./scripts/Build-Agent.ps1

      - name: Windows install gate
        shell: pwsh
        working-directory: agent
        run: ./scripts/Test-Windows-Install.ps1 -Artifacts "$PWD/artifacts" -Version "$env:AGENT_VERSION"

      - name: Package tracked source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip="agent/artifacts/Sokna-Print-Agent-$env:AGENT_VERSION-source.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          & git archive --format=zip --output=$zip HEAD:agent
          if($LASTEXITCODE -ne 0 -or !(Test-Path $zip -PathType Leaf)){throw 'Tracked source archive failed.'}

      - name: Verify required artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=$env:AGENT_VERSION
          $required=@(
            "agent/artifacts/Sokna-Print-Agent-$v-Setup.exe",
            "agent/artifacts/Sokna-Print-Agent-$v-win-x64.zip",
            "agent/artifacts/Sokna-Print-Agent-$v-source.zip",
            "agent/artifacts/SHA256SUMS-Agent-$v.txt",
            "agent/artifacts/BUILD_ARTIFACTS-Agent-$v.json",
            'agent/artifacts/windows-smoke-evidence/INSTALL_GATE_EVIDENCE.txt'
          )
          foreach($p in $required){if(!(Test-Path $p -PathType Leaf)){throw "Required artifact missing: $p"}}

      - name: Upload artifacts and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sokna-Print-Agent-${{ env.AGENT_VERSION }}-Windows
          path: |
            agent/artifacts/Sokna-Print-Agent-${{ env.AGENT_VERSION }}-Setup.exe
            agent/artifacts/Sokna-Print-Agent-${{ env.AGENT_VERSION }}-win-x64.zip
            agent/artifacts/Sokna-Print-Agent-${{ env.AGENT_VERSION }}-source.zip
            agent/artifacts/SHA256SUMS-Agent-${{ env.AGENT_VERSION }}.txt
            agent/artifacts/BUILD_ARTIFACTS-Agent-${{ env.AGENT_VERSION }}.json
            agent/artifacts/windows-smoke-evidence/**
          if-no-files-found: error
