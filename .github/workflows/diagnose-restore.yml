name: Diagnose Sokna Agent Build

on:
  push:
    paths:
      - '.github/workflows/diagnose-restore.yml'
      - 'agent6.zip'
      - 'ci/patch_agent_source.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Agent source
        shell: pwsh
        run: |
          if (!(Test-Path 'agent6.zip')) { throw 'agent6.zip missing' }
          Remove-Item agent-src -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive agent6.zip agent-src -Force
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          '=== PATCH DIAGNOSTIC ===' | Set-Content diagnostics/BUILD_DIAGNOSTIC.txt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply audited Agent source fixes
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          python ci/patch_agent_source.py agent-src *>&1 | Tee-Object -FilePath diagnostics/patch.log
          exit $LASTEXITCODE

      - name: Setup .NET from global.json
        if: steps.patch.outcome == 'success'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent-src/global.json

      - name: Initialize build diagnostic
        if: steps.patch.outcome == 'success'
        shell: pwsh
        run: |
          "`n=== dotnet --info ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          dotnet --info 2>&1 | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "`n=== global.json ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          Get-Content agent-src/global.json | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "`n=== Directory.Packages.props ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          Get-Content agent-src/Directory.Packages.props | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          Copy-Item agent-src/scripts/Build-Agent.ps1 diagnostics/Build-Agent.ps1.txt -Force
          Copy-Item agent-src/installer/Install-SoknaPrintAgent.ps1 diagnostics/Install-SoknaPrintAgent.ps1.txt -Force
          Copy-Item agent-src/src/Sokna.PrintAgent.Setup/Program.cs diagnostics/Setup-Program.cs.txt -Force

      - name: Restore
        id: restore
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        working-directory: agent-src
        run: |
          dotnet restore Sokna.PrintAgent.slnx --verbosity normal 2>&1 | Tee-Object -FilePath ../diagnostics/restore.log
          exit $LASTEXITCODE

      - name: Build, test and package
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        working-directory: agent-src
        run: |
          $ErrorActionPreference='Stop'
          try {
            & ./scripts/Build-Agent.ps1 *>&1 | Tee-Object -FilePath ../diagnostics/build.log
            if($LASTEXITCODE -ne 0){ throw "Build-Agent exited with code $LASTEXITCODE" }
          }
          catch {
            "`n=== POWERSHELL EXCEPTION ===" | Out-File ../diagnostics/build-exception.txt -Append
            $_ | Format-List * -Force | Out-String | Out-File ../diagnostics/build-exception.txt -Append
            "ScriptStackTrace:`n$($_.ScriptStackTrace)" | Out-File ../diagnostics/build-exception.txt -Append
            throw
          }

      - name: Windows installer smoke
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        working-directory: agent-src
        run: |
          try {
            ./scripts/Test-Windows-Install.ps1 -Artifacts "$PWD/artifacts" *>&1 | Tee-Object -FilePath ../diagnostics/smoke.log
          }
          catch {
            $_ | Format-List * -Force | Out-String | Out-File ../diagnostics/smoke-exception.txt
            throw
          }

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          "`n=== OUTCOMES ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "Patch: ${{ steps.patch.outcome }}" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "Restore: ${{ steps.restore.outcome }}" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "Build: ${{ steps.build.outcome }}" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "Smoke: ${{ steps.smoke.outcome }}" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          foreach($f in @('patch.log','restore.log','build.log','build-exception.txt','smoke.log','smoke-exception.txt')){
            $p="diagnostics/$f"
            if(Test-Path $p){
              "`n=== $f ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
              Get-Content $p | Select-Object -Last 300 | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
            }
          }

      - name: Commit diagnostics
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Capture Agent patch and build diagnostics'
          git push

# connector trigger: patch capture
