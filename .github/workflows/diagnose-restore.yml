name: Diagnose Sokna Agent Build

on:
  push:
    paths:
      - '.github/workflows/diagnose-restore.yml'
      - 'agent6.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Agent source
        shell: pwsh
        run: |
          if (!(Test-Path 'agent6.zip')) { throw 'agent6.zip missing' }
          Remove-Item agent-src -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive agent6.zip agent-src -Force

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent-src/global.json

      - name: Initialize diagnostic
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          "=== dotnet --info ===" | Set-Content diagnostics/BUILD_DIAGNOSTIC.txt
          dotnet --info 2>&1 | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "`n=== global.json ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          Get-Content agent-src/global.json | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "`n=== Directory.Packages.props ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          Get-Content agent-src/Directory.Packages.props | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          Copy-Item agent-src/scripts/Build-Agent.ps1 diagnostics/Build-Agent.ps1.txt -Force
          Copy-Item agent-src/installer/Install-SoknaPrintAgent.ps1 diagnostics/Install-SoknaPrintAgent.ps1.txt -Force
          Copy-Item agent-src/src/Sokna.PrintAgent.Setup/Program.cs diagnostics/Setup-Program.cs.txt -Force

      - name: Restore
        id: restore
        continue-on-error: true
        shell: pwsh
        working-directory: agent-src
        run: |
          dotnet restore Sokna.PrintAgent.slnx --verbosity normal 2>&1 | Tee-Object -FilePath ../diagnostics/restore.log
          exit $LASTEXITCODE

      - name: Build, test and package
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        working-directory: agent-src
        run: |
          ./scripts/Build-Agent.ps1 2>&1 | Tee-Object -FilePath ../diagnostics/build.log
          exit $LASTEXITCODE

      - name: Windows installer smoke
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        working-directory: agent-src
        run: |
          ./scripts/Test-Windows-Install.ps1 -Artifacts "$PWD/artifacts" 2>&1 | Tee-Object -FilePath ../diagnostics/smoke.log
          exit $LASTEXITCODE

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          "`n=== OUTCOMES ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "Restore: ${{ steps.restore.outcome }}" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "Build: ${{ steps.build.outcome }}" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          "Smoke: ${{ steps.smoke.outcome }}" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          foreach($f in @('restore.log','build.log','smoke.log')){
            $p="diagnostics/$f"
            if(Test-Path $p){
              "`n=== $f ERROR SUMMARY ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
              Select-String -Path $p -Pattern 'error |NU[0-9]{4}|failed|exception|PASS|warning|collision|cannot|not found|Copy-Item|Compress-Archive' -CaseSensitive:$false | Select-Object -Last 240 | ForEach-Object { $_.Line } | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
            }
          }

          "`n=== PUBLISHED COLLISION CHECK ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          $roots=@('agent-src/artifacts/Sokna.PrintAgent.Service','agent-src/artifacts/Sokna.PrintAgent.Worker','agent-src/artifacts/Sokna.PrintAgent.Control')
          $rows=@()
          foreach($r in $roots){
            if(Test-Path $r){ Get-ChildItem $r -File | ForEach-Object { $rows += [pscustomobject]@{Root=$r;Name=$_.Name;Hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash} } }
          }
          $groups=$rows | Group-Object Name | Where-Object Count -gt 1
          foreach($g in $groups){
            $unique=@($g.Group.Hash | Select-Object -Unique)
            if($unique.Count -gt 1){
              "DIFFERENT HASH COLLISION: $($g.Name)" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
              $g.Group | Format-Table -AutoSize | Out-String | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
            }
          }

          "`n=== PACKAGE INPUT EXISTENCE ===" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append
          foreach($p in @('agent-src/installer/Install-SoknaPrintAgent.ps1','agent-src/installer/Uninstall-SoknaPrintAgent.ps1','agent-src/README_FA.md','agent-src/docs')){ "$p = $(Test-Path $p)" | Out-File diagnostics/BUILD_DIAGNOSTIC.txt -Append }

      - name: Commit diagnostics
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/BUILD_DIAGNOSTIC.txt diagnostics/Build-Agent.ps1.txt diagnostics/Install-SoknaPrintAgent.ps1.txt diagnostics/Setup-Program.cs.txt diagnostics/*.log
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Update Agent packaging diagnostic output'
          git push

# connector trigger: packaging diagnostics
