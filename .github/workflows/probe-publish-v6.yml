name: Probe Corrected Final v6 Publisher

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/probe-publish-v6.yml']

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Query corrected final publisher runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-v6.0.0-final.yml/runs" -f branch=main -f per_page=10 > FINAL_PUBLISH_RUN_STATUS_RAW.json
          python - <<'PY'
          import json
          d=json.load(open('FINAL_PUBLISH_RUN_STATUS_RAW.json',encoding='utf-8'))
          rows=[]
          for r in d.get('workflow_runs',[]):
              rows.append({k:r.get(k) for k in ('id','run_number','status','conclusion','head_sha','event','html_url','created_at','updated_at')})
          json.dump(rows,open('FINAL_PUBLISH_RUN_STATUS.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Commit publisher status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINAL_PUBLISH_RUN_STATUS.json FINAL_PUBLISH_RUN_STATUS_RAW.json
          git commit -m 'Record corrected final v6 publisher status' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
