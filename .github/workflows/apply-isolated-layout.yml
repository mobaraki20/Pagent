name: Apply Isolated Agent Layout

on:
  push:
    paths:
      - '.github/workflows/apply-isolated-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Patch source archive deterministically
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import zipfile, shutil

          root=Path.cwd()
          src=root/'agent-src-layout'
          if src.exists(): shutil.rmtree(src)
          with zipfile.ZipFile(root/'agent6.zip') as z: z.extractall(src)

          # 1) Build/package owner: self-contained app outputs stay isolated.
          p=src/'scripts'/'Build-Agent.ps1'
          s=p.read_text(encoding='utf-8-sig')
          start=s.find('# All executables deliberately share one install directory.')
          end=s.find("Copy-Item (Join-Path $root 'installer\\Install-SoknaPrintAgent.ps1') $package")
          assert start >= 0 and end > start, 'flat payload block not found'
          replacement=r'''# Each self-contained process owns its runtime dependency set. Do not flatten these outputs:
          # Service uses the base runtime while Worker/Control use WindowsDesktop; same-named framework DLLs may
          # legitimately contain different bytes. Isolating each process prevents runtime assembly overwrite.
          $layout=[ordered]@{
            'Sokna.PrintAgent.Service'='Service'
            'Sokna.PrintAgent.Worker'='Worker'
            'Sokna.PrintAgent.Control'='Control'
          }
          foreach($project in $layout.Keys){
            $src=Join-Path $Output $project
            $dest=Join-Path $payload $layout[$project]
            New-Item $dest -ItemType Directory -Force|Out-Null
            Copy-Item (Join-Path $src '*') $dest -Recurse -Force
          }

          # The installed uninstaller stays at InstallRoot so it is easy to discover operationally.
          Copy-Item (Join-Path $root 'installer\\Uninstall-SoknaPrintAgent.ps1') (Join-Path $payload 'Uninstall-SoknaPrintAgent.ps1') -Force

          '''
          # The old block also copied the uninstaller before the flatten loop; remove the earlier copy to avoid duplicate logic.
          prefix=s[:start]
          old_uninstaller="Copy-Item (Join-Path $root 'installer\\Uninstall-SoknaPrintAgent.ps1') (Join-Path $payload 'Uninstall-SoknaPrintAgent.ps1') -Force\n\n"
          prefix=prefix.replace(old_uninstaller,'')
          s=prefix+replacement+s[end:]
          p.write_text(s,encoding='utf-8')

          # 2) Service owner: Worker lives in its own self-contained directory.
          p=src/'src'/'Sokna.PrintAgent.Service'/'PrintAgentService.cs'
          s=p.read_text(encoding='utf-8-sig')
          old='var worker=Path.Combine(AppContext.BaseDirectory,"Sokna.PrintAgent.Worker.exe");'
          new='var worker=Path.GetFullPath(Path.Combine(AppContext.BaseDirectory,"..","Worker","Sokna.PrintAgent.Worker.exe"));'
          assert old in s, 'worker path owner not found'
          s=s.replace(old,new)
          old='WorkingDirectory=AppContext.BaseDirectory,RedirectStandardError=true'
          new='WorkingDirectory=Path.GetDirectoryName(worker)!,RedirectStandardError=true'
          assert old in s, 'worker working directory owner not found'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # 3) Installer owner: service binary is under Service/, with root fallback only for rollback compatibility.
          p=src/'installer'/'Install-SoknaPrintAgent.ps1'
          s=p.read_text(encoding='utf-8-sig')
          pairs=[
            ("Join-Path $source 'Sokna.PrintAgent.Service.exe'", "Join-Path $source 'Service\\Sokna.PrintAgent.Service.exe'"),
            ("Join-Path $stage 'Sokna.PrintAgent.Service.exe'", "Join-Path $stage 'Service\\Sokna.PrintAgent.Service.exe'"),
            ("$exe=Join-Path $InstallRoot 'Sokna.PrintAgent.Service.exe'", "$exe=Join-Path $InstallRoot 'Service\\Sokna.PrintAgent.Service.exe'"),
            ("Open Sokna.PrintAgent.Control.exe as Administrator", "Open Control\\Sokna.PrintAgent.Control.exe as Administrator"),
          ]
          for old,new in pairs:
              assert old in s, f'installer owner missing: {old}'
              s=s.replace(old,new)
          old=r'''if($hadPrevious -and (Test-Path (Join-Path $InstallRoot 'Sokna.PrintAgent.Service.exe'))){
            $oldExe=Join-Path $InstallRoot 'Sokna.PrintAgent.Service.exe'
            try{& sc.exe config $service binPath= "`"$oldExe`"" start= delayed-auto obj= LocalSystem | Out-Null;Start-Service $service -ErrorAction SilentlyContinue}catch{}
          }'''
          new=r'''if($hadPrevious){
            $oldExe=Join-Path $InstallRoot 'Service\Sokna.PrintAgent.Service.exe'
            if(-not (Test-Path $oldExe -PathType Leaf)){$oldExe=Join-Path $InstallRoot 'Sokna.PrintAgent.Service.exe'}
            if(Test-Path $oldExe -PathType Leaf){
              try{& sc.exe config $service binPath= "`"$oldExe`"" start= delayed-auto obj= LocalSystem | Out-Null;Start-Service $service -ErrorAction SilentlyContinue}catch{}
            }
          }'''
          assert old in s, 'installer rollback block not found'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # 4) Real Windows smoke owner: validate the installed layout, not the obsolete flat layout.
          p=src/'scripts'/'Test-Windows-Install.ps1'
          s=p.read_text(encoding='utf-8-sig')
          pairs=[
            ("Join-Path $installRoot 'Sokna.PrintAgent.Service.exe'", "Join-Path $installRoot 'Service\\Sokna.PrintAgent.Service.exe'"),
            ("Join-Path $installRoot 'Sokna.PrintAgent.Worker.exe'", "Join-Path $installRoot 'Worker\\Sokna.PrintAgent.Worker.exe'"),
            ("Join-Path $installRoot 'Sokna.PrintAgent.Control.exe'", "Join-Path $installRoot 'Control\\Sokna.PrintAgent.Control.exe'"),
          ]
          for old,new in pairs:
              assert old in s, f'smoke owner missing: {old}'
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Static invariants before repacking.
          build=(src/'scripts'/'Build-Agent.ps1').read_text(encoding='utf-8')
          service=(src/'src'/'Sokna.PrintAgent.Service'/'PrintAgentService.cs').read_text(encoding='utf-8')
          install=(src/'installer'/'Install-SoknaPrintAgent.ps1').read_text(encoding='utf-8')
          smoke=(src/'scripts'/'Test-Windows-Install.ps1').read_text(encoding='utf-8')
          assert "$layout=[ordered]@{" in build and 'collisionHashes' not in build
          assert '"..","Worker","Sokna.PrintAgent.Worker.exe"' in service
          assert "Service\\Sokna.PrintAgent.Service.exe" in install
          assert "Worker\\Sokna.PrintAgent.Worker.exe" in smoke and "Control\\Sokna.PrintAgent.Control.exe" in smoke

          tmp=root/'agent6-isolated.zip'
          if tmp.exists(): tmp.unlink()
          with zipfile.ZipFile(tmp,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in sorted(src.rglob('*')):
                  if f.is_file(): z.write(f,f.relative_to(src).as_posix())
          (root/'agent6.zip').unlink()
          tmp.rename(root/'agent6.zip')
          print('PATCH_OK', (root/'agent6.zip').stat().st_size)
          '@ | Set-Content patch_layout.py -Encoding utf8
          python patch_layout.py

      - name: Commit patched archive
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent6.zip
          git commit -m 'Isolate Service Worker Control runtime payloads'
          git push
