# P0 diagnostic trigger: rerun after permanent installer/source-of-truth fixes
name: Diagnose Installer Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-installer-preflight.yml'

permissions:
  contents: write

concurrency:
  group: sokna-installer-preflight
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent/global.json

      - name: Build normal Agent source
        id: build
        continue-on-error: true
        shell: pwsh
        working-directory: agent
        run: ./scripts/Build-Agent.ps1

      - name: Diagnose direct installer and Setup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $report='diagnostics/INSTALLER_PREFLIGHT.txt'
          "run_id=${{ github.run_id }}`ncommit=${{ github.sha }}`nbuild_outcome=${{ steps.build.outcome }}`ntimestamp=$((Get-Date).ToUniversalTime().ToString('o'))" | Set-Content $report -Encoding utf8

          $id=[Security.Principal.WindowsIdentity]::GetCurrent()
          $p=New-Object Security.Principal.WindowsPrincipal($id)
          "identity=$($id.Name)" | Out-File $report -Append
          "is_admin=$($p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))" | Out-File $report -Append
          "elevation_type=$((whoami /groups | Select-String 'S-1-16-12288|High Mandatory Level' | Out-String).Trim())" | Out-File $report -Append

          if('${{ steps.build.outcome }}' -ne 'success'){
            'RESULT=BUILD_FAILED' | Out-File $report -Append
            Set-Content diagnostics/INSTALLER_PREFLIGHT_EXIT.txt 'BUILD_FAILED' -Encoding ascii
            exit 0
          }

          $zip=(Resolve-Path 'agent/artifacts/Sokna-Print-Agent-6.0.0-win-x64.zip').Path
          $setup=(Resolve-Path 'agent/artifacts/Sokna-Print-Agent-6.0.0-Setup.exe').Path
          $dir=Join-Path $env:RUNNER_TEMP 'sokna-direct-package'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip $dir -Force
          "zip=$zip" | Out-File $report -Append
          "service_exists=$(Test-Path (Join-Path $dir 'payload\Service\Sokna.PrintAgent.Service.exe') -PathType Leaf)" | Out-File $report -Append
          "worker_exists=$(Test-Path (Join-Path $dir 'payload\Worker\Sokna.PrintAgent.Worker.exe') -PathType Leaf)" | Out-File $report -Append
          "control_exists=$(Test-Path (Join-Path $dir 'payload\Control\Sokna.PrintAgent.Control.exe') -PathType Leaf)" | Out-File $report -Append
          "manifest_exists=$(Test-Path (Join-Path $dir 'PAYLOAD_MANIFEST.json') -PathType Leaf)" | Out-File $report -Append
          "installer_exists=$(Test-Path (Join-Path $dir 'Install-SoknaPrintAgent.ps1') -PathType Leaf)" | Out-File $report -Append

          "`n=== MANIFEST VERIFY ===" | Out-File $report -Append
          try {
            $root=[IO.Path]::GetFullPath($dir).TrimEnd('\')
            $manifest=Get-Content (Join-Path $dir 'PAYLOAD_MANIFEST.json') -Raw | ConvertFrom-Json
            "entries=$(@($manifest).Count)" | Out-File $report -Append
            $n=0
            foreach($entry in @($manifest)){
              $n++
              $rel=([string]$entry.path).Replace('/','\')
              $file=[IO.Path]::GetFullPath((Join-Path $root $rel))
              if(-not $file.StartsWith($root+'\',[StringComparison]::OrdinalIgnoreCase)){throw "Path escape at entry $n"}
              if(-not (Test-Path $file -PathType Leaf)){throw "Payload file missing at entry $n: $rel"}
              if((Get-Item $file).Length -ne [int64]$entry.size){throw "Payload size mismatch at entry $n: $rel"}
              $actual=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if($actual -ne ([string]$entry.sha256).ToLowerInvariant()){throw "Payload SHA mismatch at entry $n: $rel"}
            }
            'manifest_verify=PASS' | Out-File $report -Append
          } catch {
            'manifest_verify=FAIL' | Out-File $report -Append
            ($_ | Format-List * -Force | Out-String -Width 300) | Out-File $report -Append
          }

          "`n=== DIRECT INSTALLER /SKIPSTART ===" | Out-File $report -Append
          $installer=Join-Path $dir 'Install-SoknaPrintAgent.ps1'
          $out=Join-Path $env:RUNNER_TEMP 'direct-installer.out.txt'
          $err=Join-Path $env:RUNNER_TEMP 'direct-installer.err.txt'
          Remove-Item $out,$err -Force -ErrorAction SilentlyContinue
          $direct=Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$installer,'-SkipStart') -WorkingDirectory $dir -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          "direct_exit=$($direct.ExitCode)" | Out-File $report -Append
          "--- stdout ---" | Out-File $report -Append
          if(Test-Path $out){Get-Content $out | Where-Object {$_ -notmatch '(?i)authorization|bearer|token|secret|hmac'} | Out-File $report -Append}
          "--- stderr ---" | Out-File $report -Append
          if(Test-Path $err){Get-Content $err | Where-Object {$_ -notmatch '(?i)authorization|bearer|token|secret|hmac'} | Out-File $report -Append}

          $installedUninstaller=Join-Path $env:ProgramFiles 'Sokna\PrintAgent\Uninstall-SoknaPrintAgent.ps1'
          if(Test-Path $installedUninstaller){& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installedUninstaller | Out-Null}
          if(Get-Service SoknaPrintAgent6 -ErrorAction SilentlyContinue){& sc.exe delete SoknaPrintAgent6 | Out-Null;Start-Sleep -Seconds 2}

          "`n=== EMBEDDED SETUP /QUIET ===" | Out-File $report -Append
          $setupOut=Join-Path $env:RUNNER_TEMP 'setup-preflight.out.txt'
          $setupErr=Join-Path $env:RUNNER_TEMP 'setup-preflight.err.txt'
          Remove-Item $setupOut,$setupErr -Force -ErrorAction SilentlyContinue
          $setupProc=Start-Process -FilePath $setup -ArgumentList '/quiet' -Wait -PassThru -RedirectStandardOutput $setupOut -RedirectStandardError $setupErr
          "setup_exit=$($setupProc.ExitCode)" | Out-File $report -Append
          "--- setup stdout ---" | Out-File $report -Append
          if(Test-Path $setupOut){Get-Content $setupOut | Where-Object {$_ -notmatch '(?i)authorization|bearer|token|secret|hmac'} | Out-File $report -Append}
          "--- setup stderr ---" | Out-File $report -Append
          if(Test-Path $setupErr){Get-Content $setupErr | Where-Object {$_ -notmatch '(?i)authorization|bearer|token|secret|hmac'} | Out-File $report -Append}

          $setupLogRoot=Join-Path $env:ProgramData 'Sokna\PrintAgentSetup\logs'
          if(Test-Path $setupLogRoot){
            "`n=== SETUP JSON LOGS ===" | Out-File $report -Append
            Get-ChildItem $setupLogRoot -File | Sort-Object LastWriteTime | Select-Object -Last 5 | ForEach-Object {Get-Content $_.FullName -Raw | Out-File $report -Append}
          }

          "`n=== POST STATE ===" | Out-File $report -Append
          & sc.exe query SoknaPrintAgent6 2>&1 | Out-File $report -Append
          & sc.exe qc SoknaPrintAgent6 2>&1 | Out-File $report -Append
          & sc.exe qfailure SoknaPrintAgent6 2>&1 | Out-File $report -Append
          $pf=Join-Path $env:ProgramFiles 'Sokna\PrintAgent'; "program_files=$(Test-Path $pf)" | Out-File $report -Append
          $pd=Join-Path $env:ProgramData 'Sokna\PrintAgent'; "program_data=$(Test-Path $pd)" | Out-File $report -Append
          $health=Join-Path $pd 'health.json'; "health=$(Test-Path $health -PathType Leaf)" | Out-File $report -Append
          if(Test-Path $health){Get-Content $health -Raw | Out-File $report -Append}

          Set-Content diagnostics/INSTALLER_PREFLIGHT_EXIT.txt "direct=$($direct.ExitCode);setup=$($setupProc.ExitCode)" -Encoding ascii

      - name: Commit evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/INSTALLER_PREFLIGHT.txt diagnostics/INSTALLER_PREFLIGHT_EXIT.txt
          if(git diff --cached --quiet){exit 0}
          git commit -m 'Capture installer preflight evidence'
          git pull --rebase origin main
          git push
