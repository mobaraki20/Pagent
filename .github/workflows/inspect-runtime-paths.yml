name: Inspect Agent Runtime Paths

on:
  push:
    paths:
      - '.github/workflows/inspect-runtime-paths.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract and inspect
        shell: pwsh
        run: |
          Expand-Archive agent6.zip agent-src -Force
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $out='diagnostics/RUNTIME_PATHS.txt'
          '=== Worker/Control/process path references ===' | Set-Content $out
          Get-ChildItem agent-src/src -Recurse -Include *.cs,*.ps1,*.csproj | ForEach-Object {
            $matches=Select-String -Path $_.FullName -Pattern 'Sokna\.PrintAgent\.(Worker|Control|Service)\.exe|AppContext\.BaseDirectory|ProcessStartInfo|Process\.Start|InstallRoot' -CaseSensitive:$false
            if($matches){
              "`n--- $($_.FullName) ---" | Out-File $out -Append
              $matches | ForEach-Object { "L$($_.LineNumber): $($_.Line)" } | Out-File $out -Append
            }
          }
          Copy-Item agent-src/src/Sokna.PrintAgent.Service/PrintAgentService.cs diagnostics/PrintAgentService.cs.txt -Force
          Copy-Item agent-src/installer/Uninstall-SoknaPrintAgent.ps1 diagnostics/Uninstall-SoknaPrintAgent.ps1.txt -Force
          Copy-Item agent-src/scripts/Test-Windows-Install.ps1 diagnostics/Test-Windows-Install.ps1.txt -Force
      - name: Commit report
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Capture installer smoke test'
          git push

# connector trigger smoke-script capture
