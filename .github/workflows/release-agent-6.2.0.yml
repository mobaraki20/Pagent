name: Release Sokna Print Agent 6.2.0

on:
  push:
    branches:
      - 'release/v6.2.0-final'
    paths:
      - '.github/workflows/release-agent-6.2.0.yml'

permissions:
  contents: write

concurrency:
  group: sokna-agent-release-v6.2.0
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 2fb431962542ab59973142a9820eb673ab05d763
      RELEASE_TAG: v6.2.0
      EXPECTED_VERSION: 6.2.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout audited release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify audited source and version
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:TARGET_SHA){throw "Unexpected source commit: $actual"}
          [xml]$props=Get-Content 'agent/Directory.Build.props' -Raw
          $version=[string]$props.Project.PropertyGroup.SoknaAgentVersion
          if($version -ne $env:EXPECTED_VERSION){throw "Expected version $env:EXPECTED_VERSION, got $version"}
          if(Test-Path 'agent6.zip'){throw 'Legacy agent6.zip must not be part of the active source tree.'}
          if(Test-Path 'ci/patch_agent_source.py'){throw 'Build-time source patching is forbidden.'}
          "AGENT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: agent/global.json

      - name: Build, test and package
        shell: pwsh
        working-directory: agent
        run: ./scripts/Build-Agent.ps1

      - name: Windows install gate
        shell: pwsh
        working-directory: agent
        run: ./scripts/Test-Windows-Install.ps1 -Artifacts "$PWD/artifacts" -Version "$env:AGENT_VERSION"

      - name: Package tracked source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip="agent/artifacts/Sokna-Print-Agent-$env:AGENT_VERSION-source.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          & git archive --format=zip --output=$zip $env:TARGET_SHA`:agent
          if($LASTEXITCODE -ne 0 -or !(Test-Path $zip -PathType Leaf)){throw 'Tracked source archive failed.'}

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=$env:AGENT_VERSION
          $required=@(
            "agent/artifacts/Sokna-Print-Agent-$v-Setup.exe",
            "agent/artifacts/Sokna-Print-Agent-$v-win-x64.zip",
            "agent/artifacts/Sokna-Print-Agent-$v-source.zip",
            "agent/artifacts/SHA256SUMS-Agent-$v.txt",
            "agent/artifacts/BUILD_ARTIFACTS-Agent-$v.json",
            'agent/artifacts/windows-smoke-evidence/INSTALL_GATE_EVIDENCE.txt'
          )
          foreach($p in $required){if(!(Test-Path $p -PathType Leaf)){throw "Required artifact missing: $p"}}

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          # Sokna Print Agent 6.2.0

          Final GitHub release for the Sokna Windows Print Agent 6.2.0.

          Highlights:
          - print reliability and recovery hardening
          - durable Accept/Start request identity and reconciliation support
          - resilient report outbox behavior
          - local loopback wake bridge for lower cashier latency
          - exact preview path using the Windows receipt renderer
          - native-DPI, 1-bit monochrome thermal output path retained for sharper receipt text
          - Windows build/test/install gate passed before release publication

          Release source commit:
          `2fb431962542ab59973142a9820eb673ab05d763`

          Important: `submitted` means accepted by the Windows spooler; it is not proof that paper physically exited the printer. Real-printer UAT remains the final hardware validation step.
          '@ | Set-Content -Path 'agent/artifacts/RELEASE_NOTES-Agent-6.2.0.md' -Encoding UTF8

      - name: Publish final GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null){throw "Release $env:RELEASE_TAG already exists."}
          $v=$env:AGENT_VERSION
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:TARGET_SHA `
            --title "Sokna Print Agent $v" `
            --notes-file "agent/artifacts/RELEASE_NOTES-Agent-$v.md" `
            --latest `
            "agent/artifacts/Sokna-Print-Agent-$v-Setup.exe" `
            "agent/artifacts/Sokna-Print-Agent-$v-win-x64.zip" `
            "agent/artifacts/Sokna-Print-Agent-$v-source.zip" `
            "agent/artifacts/SHA256SUMS-Agent-$v.txt" `
            "agent/artifacts/BUILD_ARTIFACTS-Agent-$v.json" `
            "agent/artifacts/windows-smoke-evidence/INSTALL_GATE_EVIDENCE.txt"
          if($LASTEXITCODE -ne 0){throw 'GitHub Release publication failed.'}
